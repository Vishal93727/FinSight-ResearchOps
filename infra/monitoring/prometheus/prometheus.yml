rule_files:
  - /etc/prometheus/rules/*.yml

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: finsight-api
    metrics_path: /metrics
    static_configs:
      - targets: [api:8000]
  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector:8889]
