name: FinSight ResearchOps CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: finsight
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: finsight
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finsight -d finsight"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    env:
      APP_ENV: test
      JWT_SECRET: ci-test-secret-do-not-use-in-production-2026
      DATABASE_URL: postgresql+psycopg://finsight:test-password@localhost:5432/finsight
      REDIS_URL: redis://localhost:6379/0
      FINSIGHT_RUN_LIVE_CHECKS: "1"
      PYTHONPATH: src:backend
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[dev,observability]'
      - run: ruff check backend src apps migrations
      - run: python -m compileall -q backend src apps migrations
      - run: bash scripts/tests/test_backup_scripts.sh
      - run: bash scripts/tests/test_data_volume_backup_restore.sh
      - run: alembic upgrade head
      - run: pytest -p no:cacheprovider --cov=app --cov=finsight --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package.json
      - run: npm install
      - run: npm run build

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet
